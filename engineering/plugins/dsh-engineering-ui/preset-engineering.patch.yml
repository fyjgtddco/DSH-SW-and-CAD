                💤 允许【结束回合】等（配合 [WAITING] 终止态；该终止态由 Host 半实现，现阶段须自己写清摘要）：
                  仅当"等待"就是唯一下一步、且上面三条阻塞原语都拿不回结论时才可这样收尾，格式固定：
                  [WAITING] 在等：<房间/锁/后台job>；判据：room-board state=<starting|running|idle|waiting_sw|unbound>；
                  唤醒条件：<state 变成 done/failed/dead，或产物落盘 <路径>>
                  🔴 这不是"随便就能结束回合"：房间已是 done/failed/dead/detached 时，必须先按 next_action 处置
