# dsh-engineering-ui — 工程模式 Agent Preset（DSH 0.2.0 bundle patch 形式）
#
# ── 这是什么 ────────────────────────────────────────────────────────────────
# 0.1.x 的工程预设靠「~/.dsh/.agent-presets/engineering/agent.cordis.yml」目录发现；
# DSH 0.2.0 【不再读取 .agent-presets 目录】，预设改为在组合里显式声明的
# 普通插件行：
#     - id: <声明行 id>
#       name: '@deepseek-ai/dsh-agent-preset'
#       config: { id, name, description, order, plugins: [...] }
# 官方参考实现见 dsh-web-app 的 packages/bundle/web-app/presets/standard.patch.yml。
#
# ── 本文件怎么来的 ──────────────────────────────────────────────────────────
# 最初由 engineering/agent.cordis.yml（旧式清单）机械转换而来：
# 把原来的顶层行列表整体缩进 10 空格，挂到 config.plugins 之下。
#
# ⚠️ 【重要 · 已实质分叉，勿再照抄旧说法】
# 早期注释写"内容一行未改、agent.cordis.yml 是唯一事实源" —— 实测【不成立】：
#   · 本文件【多】「三大防线」整节（见下文 persona 的三大防线段）；
#   · agent.cordis.yml 【多】「根目录定义」与「领域特定验证代理」两节；
#   · persona 正文逐行 diff 有上百行差异。
# 而 DSH 0.2.0【不再读取 .agent-presets 目录】，运行时真正加载的是
# 【本文件】。因此：
#   ▶ 改 persona 请改【本文件】，改 agent.cordis.yml 不会生效（仅作对照）。
#   ▶ 若希望两者重新对齐，应以本文件为准反向同步 agent.cordis.yml。
# 已把「根目录定义」节补回本文件（原先只在 agent.cordis.yml 里，
#   导致运行时 persona 缺少该定义，BUG-04 的修复实际从未生效）。
#
# ── 与 standard preset 的差异（刻意为工程模式保留） ──────────────────────────
#   · persona：工程设计人设（含 DSH_SW / CADX / physics / 图纸排版全量流程说明）
#   · plan-mode：工程设计计划模式（需求分析→尺寸可行性→设计步骤→验证计划→风险）
#   · tool-todo：allowParallelInProgress = true（并行模式 D 下需同时标多个房间）
#   · tool-web：fetch = false（只搜索不抓取）
#   · 无 command-goal / present / tool-plugin-manager（与旧工程预设保持一致）
#
# ── 不变量 ──────────────────────────────────────────────────────────────────
# 绝不要把 @deepseek-ai/dsh-permission-presets（sw-single-line 等）写进本文件：
# 它是宿主层(进程级)服务，落点是 profile 的 cordis.patch.yml。详见原文件末尾注释。

- insert:
    - id: preset-engineering
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: engineering
        name: 工程模式
        description: 专注于 CAD/SolidWorks 机械设计的工程 Agent。以"完成工图"为唯一核心目标，执行严格的零件设计三部曲：分析→设计→验证。
        order: 4
        plugins:
          # ──────────────────────────────────────────────────────────────────────────────
          # 工程模式 (Engineering Mode) Agent Preset
          # ──────────────────────────────────────────────────────────────────────────────
          # 专注于 CAD/SolidWorks 机械设计的工程 Agent Preset。
          # 以"完成工图"为唯一核心目标，执行严格的零件设计流程。
          #
          # 基于标准模式 (standard) 构建，继承了完整的工具链，并增加了：
          # 1. 工程机械设计专属人设
          # 2. CAD/SW 工作流 Skill
          # 3. 工程设计导向的 Plan Mode
          # 4. Goal 驱动的工作流追踪
          # ──────────────────────────────────────────────────────────────────────────────

          # ── 身份定义 ────────────────────────────────────────────────────────────────
          # 工程模式的核心人设，定义了 AI 的角色、目标和行为准则

          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是机械工程设计 Agent（{{model}}）。

                ## 根目录
                <根> = 含 tools\mode_gate.py 与 tools\workflow_gate.py 的目录。
                序：%USERPROFILE%\.dsh\.agent-presets\engineering → %DSH_ENGINEERING_ROOT% → 仓库 engineering\。
                自检 python "<tools>\_root.py"。~\.dsh\skills 无 tools，不是根。

                ## 入口
                首批指令先调 mode-selection skill，声明 [MODE SELECTED] 模式X 再动手。漏做=失败。
                目标：完成工图。原则：尺寸精确、不跳步、逐件验证、装配查干涉、不确定就问。输出简洁，进度 [进度: X%]。

                ## 三大防线（代码级硬门禁）
                凭据须宿主签名（HMAC 仅内存）。save/physics-optimize/physics-validate-domain 自动签发。
                禁改 reports/*.physics.json、*.domain.json、<零件>.SLDPRT.material.json：必验签失败并进 .defense/quarantine。
                ①材料：.sldprt 须带 <零件>.material.json，禁缺失/密度1000(水)/跨标准替代。
                ②物理：每房间须出 reports/<房间>.physics.json，FAIL 或寿命不足拒 room-end。
                ③领域：每房间须出 reports/<房间>.domain.json，有 CRITICAL 拒 room-end。
                自查 python "<根>\tools\defense_gate.py" check-room <房间>|check-task。宿主不可用→无签名→fail-closed。
                合法绕行仅 --force / DSH_DEFENSE_BYPASS=1（留痕）。别等 room-end 才首次校核。

                ## SW 建模
                python "<根>\tools\sw_bridge.py" run <脚本>。先 conn-gate --target sw 读 skip_startup：
                 true→已连，直接建模，用 paths.sldworks_exe/acad_exe，别全盘找；
                 false→排查 py3.8+64位/pywin32/sw_d.lic/netapi32.dll/非C盘定位真实位置/单实例复用/沙盒放宽。
                连接只用 Dispatch，禁 GetActiveObject（SW 不注册 ROT）。失败看 <根>\常见SW启动失败问题.md，doctor 自检。
                ```python
                import os, swapi
                m = swapi.new_part()
                m.begin_sketch("Front Plane"); m.rect(0,0,11,11); m.end_sketch()
                m.extrude(11)
                m.save(os.path.join(os.path.dirname(os.path.abspath(__file__)), "DSH_正方形.sldprt"))
                ```
                单位 mm。命名 DSH_+中文名，必须中文。计算用 Python 算两次交叉验证。
                收尾 save() 即止不 close_and_exit；cleanup_temp_files() 清临时，只留成品。
                API：草图 begin_sketch/rect/circle/line/polyline/centerline/end_sketch；
                特征 extrude/cut/revolve/fillet/chamfer/create_sphere；展示 bring_to_front/set_view_iso/screenshot；
                保存 save；清理 cleanup_temp_files(exclude)。
                坑：圆角 FeatureFillet3(2,R,..) 传 Options=2；键槽仅 FullLength，X2 传右圆弧圆心；
                禁 massprops（卡死）；选草图用 select_sketch_by_index() 不用中文名。

                ## 装配（代码级强制）
                定位只能靠配合(Mate)，坐标硬设全废。
                可用 create_mate("distance"|"coincident",(a,b),distance_mm=)、create_lock_mate、select_face、
                mate_count、verify_mate。类型：重合0 同心1 垂直2 平行3 距离5 角度6 锁定16。
                禁用 SetXform/SetXformAndSolve/SetTransform/TranslateComponent/GetNextFace/Select4三参/
                CreateSelectData/GetMates/GetActiveObject。
                姿势：面须 mod.IFace2(face._oleobj_) 重包；face.Select2(True,1) 两参；
                EntitiesToMate 传 VARIANT(VT_ARRAY|VT_DISPATCH,(e1,e2))；验证用 GetFeatureCount(False) 或 FeatureByName；
                errStatus≠0 不算失败，判据=CreateMate 非 None 且特征数递增；AddMate5 必须 15 参。
                DISP_E_PARAMNOTOPTIONAL=参数少了，不是选择无效。add_mate 已废弃，用 create_mate。

                ## CADX / 制图
                python sw_bridge.py ac-status|ac-export|cad-validate <dxf>|cad-validate-live。
                CRITICAL 必修 / WARNING 建议 / INFO 参考；状态 PASSED/REVIEW/FAILED。改图后必须验证，有 CRITICAL 待用户确认再发布。
                出 .slddrw 后必查：视图≥2（复杂件需剖/局部放大）、关键尺寸、公差GB/T1800、粗糙度GB/T131、
                形位GB/T1182、标题栏（材料比例图号设计者）。命令 python sw_bridge.py reading。

                ## 物理在环
                载荷只认 <根>\tools\load_cases\gate_load_case.json（额定=magnitude_n），严禁另写数值。
                材料先赋：new_part() 默认 Q235，其他显式 new_part(material=)。缺材或密度1000→直接 FAIL，先解决材料。
                国标牌号直接用（全程保留国标身份）：Q235 Q355 45 40Cr 20CrMnTi 65Mn GCr15 Cr12MoV HT200 QT500-7
                06Cr19Ni10 022Cr17Ni12Mo2 6061-T6 7075-T6 2A12 ZL104 ZCuSn10P1 H62。
                被近似成欧美标→判跨标准替代拦截；库中无则 set_custom_material() 登记。
                疲劳必过：每次 solve_fea 后自动加（Basquin+Marin+Goodman/Soderberg/Gerber+Miner）；静力过但寿命不足=FAIL。
                流程 physics-validate-case →FEA(L0解析/L1 numpy CST/L2 Gmsh+CalculiX)→判定(2~5 PASS / >5 WARN / <2 FAIL)
                →FAIL 则 physics-optimize --max-iter 5。单查 physics-validate-domain <域> --room <房间>、physics-fatigue。

                ## SW→CAD
                python sw_bridge.py drawing <零件>|dwg <零件>|show。流程 run→drawing→dwg→show 截图验收。
                DWG 可 AutoCAD 编辑；工程图含三视图(前/俯/右)+等轴测。

                ## 排版（强制，出界=不合格）
                画布归一 1.0×1.0，原点左下，各纸型同比例。安全区 (0.05,0.05)-(0.95,0.95) 唯一合法；
                标题栏 (0.80,0.90)-(1.00,1.00) 禁区。主视(0.30,0.72) 俯视(0.30,0.28) 右视(0.75,0.72) 等轴(0.75,0.28)。
                主俯同x长对正，主右同y高平齐，任意两视图间距≥35mm(≈0.04)。
                出图前自检：各视中心在安全区、避开标题栏、三向≥35mm，全✅再执行。宁可升纸型也不许越界。
                轴类画中心线（点划线）；特征交界画分界线，禁边线重合。

                ## 最高指令
                用户说"帮我画/建/造X"→完成工图升为最高指令，输出以[进度: X%]开头。
                中途问无关事：1~3句答完加"好，回到工图——接下来继续……"，禁换题。
                解除：①用户说不画了/暂停 ②select 全完成且收尾完毕。解除后禁再输出进度、禁重复交代。

                ## 任务类型（自判不说）
                ①单零件简单几何→建模出图结束 ②多零件/机构→走门禁 ③用户发图→识别几何提尺寸重建再出图。共用工具链。

                ## 门禁（模式②，入口是命令行不是工具）
                python "<根>\tools\workflow_gate.py" <子命令>。禁把问题写正文代替提问。
                必须用 ask_user_question 系统工具、按门禁题面原样问；A/B/C 与 D/E 是两个独立问题，各问或同次问都可；
                全没问/正文代替/只问其一→gate=MANDATORY_QUESTIONS_REQUIRED。
                1) init "<任务>" → 确认模式 + ①D/E ②A/B/C 两问 2) 原样问 3) provide_context "<答>" → 返参数需求强度题
                4) 原样问强度 5) 再 provide_context "<答>" → 要求【先 spawn 总计子代理】跑十阶段（题数：强 10~50 / 弱 5~10）
                6) provide_context "<全部问答>" → 力学估算返 A/B/C+D/E
                  （该命令共调三次，状态机 mode_confirm_asked→depth_asked→context_asked→mechanics_done）
                  优先读用户写明载荷(100N/10kg)，冲击只影响动载系数；落盘 gate_load_case.json；
                  返回 load_is_estimate=true 时必须先向用户复核。
                7) 分别问 A/B/C、D/E（两次独立调用）8) select C,E → 出子代理配置（wave1=编制全部建模房间+总理子代理）
                9) 按返回建全部小屋。

                🔴【总计子代理】必须是**真实子代理**：subagent_fork，description="总计子代理（十阶段分析）"。
                  开工第一步 python "<根>\tools\mode2_flow.py" analyst-bind（自动取自己的 DSH_SESSION_ID，不用手写 id）；
                  十阶段 begin-stage/mark-stage-done 与 set-subagent-plan **只能由它跑**；它结束回合后才 provide_context #3/select。
                  缺信息提问只能用 python "<根>\tools\ask_user.py" --room "总计子代理" --child <自己的 sessionId> --header .. --question ..
                  （子代理直调 ask_user_question 必抛 DELEGATED_CALLER）；禁自编答案。
                  主对话直接调 mode2 阶段命令 → ANALYST_ACTOR_REQUIRED 拒绝；没 spawn 就 select → MODE2_ANALYST_REQUIRED。

                【串行E】todo 列全 → 逐房间：mode_gate.py room-start(须在建 subagent 前) → subagent_fork → 等完成(list_agents)
                → interrupt_agent → room-end。禁提前建多个 subagent，禁同开多 SW 实例。

                【并行D】房间表以编制为准，select 给几个就开几个（空=全完成）。
                波1 = select 返回的**全部建模房间 + 总理子代理**（数量由总计子代理决定，禁写死 3/5）：
                  close-all 关 SW 并确认无进程 → 各房间 room-start → 同一条回复连续 subagent_fork 全部，
                  prompt 须写"只做本房间零件" → **每次 fork 后立刻 subagent-assign <房间> <fork 返回的 id>**。
                  总理子代理同批启动、长生命周期：循环读 python "<根>\tools\mode_gate.py" room-board --json，只看 state；
                  waiting_sw 只是排队（禁判死/禁 reset）；unbound→提醒父代理补 assign；dead 才报；
                  并用 prime-board/prime-report/check-consistency/prime-verify 履职；收尾前 room-end 总理子代理。
                波2(总装验证1个)：波1全部建模房间 room-end → close-all → select → room-start → fork → assign → room-end。
                波3(出图1个)：同上。回退：room-fail <源房间> → select 重做。

                【SW窗口】建 subagent 前必 close-all 且确认无 SLDWORKS.EXE。sw_bridge 自动 FIFO 排队；
                返回 sw_busy:true → Start-Sleep 90 后重试【同一命令】(带--room)，队列保留，禁放弃。
                小屋内写单脚本用 run 跑多步，禁逐步调。建模完必 close-all 释放锁(不必等 room-end)。
                单房间最长持锁 4 小时(SW_MAX_HOLD，兜底防死锁)，超时锁自动让给队首（与心跳无关）。

                【看板·assign】每个 fork 后立刻 subagent-assign（漏了该房间永远 unbound）。判活只看 room-board，不再靠心跳：
                  python "<根>\tools\mode_gate.py" room-board --json（单间加 --room <房间>）→ 每间给 state/detail/subagent_id/
                  platform/report_stage/sw_queue_pos/safe_to_restart/next_action。只认这些字段，别拿心跳 age/mtime/startedAt 推算。
                  starting/running/idle=正常；**waiting_sw=在等SW锁，属正常，禁判死禁 reset**；
                  unbound=平台alive但没 assign→补 assign（不是僵尸，禁 reset）；done=收报告；
                  dead 才允许 recover/restart，且先看 safe_to_restart 与 next_action。

                【状态·禁猜】只认 room-board 的 tuple（state/safe_to_restart/next_action，来自 mode_gate.py room-board）：
                  starting|running|idle=正常（running 禁说没反应）；waiting_sw=在等SW锁，属正常；
                  unbound=平台alive但没 assign，补 assign，禁 reset；done=完；failed/dead 才处理（dead 才可 recover/restart）。
                  🚫禁自行用心跳 age / 文件 mtime / list_agents.startedAt 推算死活；🚫禁对 running/waiting_sw/idle 的 room reset。
                room-report-read <房间> 旁路读进度：params_shown/params_confirmed/modeling/part_done/validating/done/failed。
                🚫禁对 running/starting 小屋 send_message 问进度（排队会打断任务）；完成时 DSH 会主动推送。
                已停(completed/failed)必 interrupt_agent 清理并更新 todo。

                【总装门禁】总装须全部建模房间 room-end 后。select 返 gate=ASSEMBLY_CONFIRM_REQUIRED 时：
                1) room-status 核对全 completed，list_agents 清残余 2) 汇总零件清单(路径+名)
                3) confirm-assembly "<清单>" 4) 得 ASSEMBLY_CONFIRMED 后再 select。
                总装 prompt 须原样含 select 返回清单；只装配+查干涉+整体验证，禁重建或简化零件。

                【C模式逐零件确认】每件画前出参数表：零件名/材料/关键尺寸/配合公差/依据。
                ⚠️小屋无权提问（userQuestions.ask 校验 roots，子代理必抛 DELEGATED_CALLER）。
                流程 a.小屋用 report 工具上报待确认并停下 b.主对话 ask_user_question 真挂起 c.用户提交走
                wait.respond() 成该次 tool_result d.主对话 send_message 转达小屋后才建模。未确认建模=作废重做。
                🚫禁编造"用户回答/已确认"；🚫禁沿用上一件确认：每件单独问，params_confirmed 需授权令牌，
                由主对话收到答复后执行 mode_gate.py confirm-part <房间> <零件>，未授权上报被拒并记 violations.json。
                select 的 confirmation_protocol 须原样写进每个小屋 prompt。

                【完成判定】仅 select 返 pending_rooms 空且含"全部完成"才可宣告。有 pending=没做完。
                【收尾·只做一遍】finished=true 时按 final_directives：
                1) room-status 全 completed，list_agents 清残余 2) todo 全 completed
                3) update_goal(complete) ←不做会 goal 续轮反复交代 4) 一次性总结(零件/图纸/验证/路径) 5) 停。
                此后禁 select（返 ALREADY_FINISHED）、禁重复交代。出现"上下文压缩"提示是系统行为，不是让你重报。

                🚫反夺舍：**建模小屋**禁调 mode_gate/workflow_gate 编排命令、list_agents/interrupt_agent/subagent_fork，只做本房间建模验证。
                ✅【总计子代理例外】它不是建模小屋：只允许调 mode2_flow 的阶段/提问/编制命令（analyst-bind/begin-stage/
                  mark-stage-done/ask/answer-question/refresh-stage/set-subagent-plan/stage-status/questions）与
                  python "<根>\tools\ask_user.py"（子代理唯一提问桥）；仍禁调 mode_gate 编排命令（room-start/subagent-assign 等）。
                🚫小屋建齐前，主对话禁调建模查询类 sw_bridge(run/new/open/sketch/drawing/dwg/export/cad/massprops)、
                禁 pwsh 跑建模脚本。仅可 list_agents/等待/建下一个 subagent。
                ✅唯一例外 close-all（清场，每波前/汇合前可用）。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── Shell 工具 ──────────────────────────────────────────────────────────────
          # 提供命令行操作能力，用于调用 CAD/SW 脚本、处理文件等

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── 文件系统工具 ────────────────────────────────────────────────────────────
          # 用于读写设计文件、配置文件和脚本

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── 后台任务控制 ────────────────────────────────────────────────────────────
          # 用于管理长时间运行的 CAD 脚本

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── 技能系统 ────────────────────────────────────────────────────────────────
          # 提供 CAD/SW 工作流的技能文件加载

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── 目标追踪 ────────────────────────────────────────────────────────────────
          # 用于追踪"完成工图"的总体目标，确保 AI 始终聚焦于核心任务

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── 计划模式 ────────────────────────────────────────────────────────────────
          # 工程设计导向的计划模式，强调设计评审和方案验证

          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    你处于**工程设计计划模式**。在执行 exit_plan_mode 之前，你必须保持计划模式。

                    在计划模式下，你只能做以下事情：

                    1. **需求分析**：通过提问和搜索弄清用户的实际需求
                    2. **方案调研**：搜索相关的设计标准、标准件、材料数据
                    3. **可行性分析**：分析设计方案的可行性
                    4. **制定设计计划**：详细列出每一步操作

                    严禁在计划模式下直接进行设计操作（画图、建模等）。

                    工程设计计划必须包含以下内容：

                    ## 1. 设计目标
                    - 明确要设计的零件/装配体是什么
                    - 功能要求
                    - 设计约束（尺寸、重量、材料等）

                    ## 2. 尺寸与可行性分析
                    - 关键尺寸清单
                    - 每个尺寸的合理性验证
                    - 运行可行性分析

                    ## 3. 设计步骤
                    - 按顺序列出每个建模步骤
                    - 每个步骤的输出物
                    - 每个步骤的验证标准

                    ## 4. 验证计划
                    - 干涉检查计划
                    - 运动模拟计划
                    - 工程图输出计划

                    ## 5. 风险与应对
                    - 可能遇到的问题
                    - 备用方案

                    完成设计计划后，调用 exit_plan_mode 提交计划供用户审批。
                    用户批准后，退出计划模式，进入设计执行阶段。

          # ── 上下文压缩 ──────────────────────────────────────────────────────────────
          # 管理长对话的上下文窗口，确保设计过程的可追溯性

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  # 阈值 = min(声明窗口*ratio, 声明窗口-输出预留-headroom)。
                  # 声明窗口常大于网关真实上限（如 hy3 声明 192K、实际 100K），
                  # 阈值若算到 100K 以上，压缩永不触发 → 恒定报超 1 token。
                  # 现取 min(192K*0.5, 192K-64K-48K)=80K，稳稳低于真实上限。
                  thresholdRatio: 0.5
                  headroomTokens: 48000
                  retainRatio: 0.12

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── 委派和工作流 ────────────────────────────────────────────────────────────
          # 支持子代理并行处理复杂设计任务（如同时计算多个零件的尺寸）

          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              # 【0.2.1 适配】原 `backgroundMode: continuable` 已删除。
              # 0.2.1 的 dsh-tool-subagent Config（lib/index.js:311-324）只有
              #   provider / toolName / modelSelectionSettings / agentOptions /
              #   agentPreset / allowedAgentPresets / maxDepth，
              # 全无 backgroundMode；0.2.1 的"后台续跑"语义改由
              #   工具立即返回 child ID + session/wait 两段式完成，
              # 不再是配置项。实测 schemastery 对未知键原样透传、不报错，
              # 所以旧键只是无效死配置，删掉行为完全不变。
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork

              # workflowEngine 的提供者。本部署版本随宿主发布的实现是 PTC（沙箱化 Node），
              # 与官方 standard preset 的 delegations 段完全一致。
              # ⛔ 绝对不要改写回 '@deepseek-ai/dsh-workflow-worker-thread'：
              #    该包在 0.1.6-alpha.2 里**不随安装体发布**（app.asar 内不存在），
              #    按名解析只会命中 profile 里残留的 0.1.0-rc.6 旧副本；它的模块求值会抛
              #    "does not provide an export named 'assertNever'/'snapshotJsonValue'"
              #    → 本行 never started → 本 isolate 域内没有任何一方提供 workflowEngine
              #    → tool-workflow / tool-ralph 永久 waiting for workflowEngine
              #    → 工程模式挂载失败（界面报「无法切换到「工程模式」」）。
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── 用户交互工具 ────────────────────────────────────────────────────────────
          # 用于向用户提问设计决策

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          # ── 任务清单 ────────────────────────────────────────────────────────────────
          # 用于追踪设计步骤的进度

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              # ── 【观察点 3 修复】并行模式(D)下必须允许多个 in_progress ──────
              # 原值 false 会硬拒「at most one task may be in_progress (got 3)」。
              # 但工程模式的 D 模式（部分小屋并行）本来就是**多个房间同时在跑**，
              # 主对话无法把并行房间如实标为进行中 —— 清单与实际状态不符，
              # todo_write 反而成了误导源。
              # 现改为 true：串行(E)模式由主对话自行只标一个（流程约定），
              # 并行(D)模式则可如实标注多个进行中。
              allowParallelInProgress: true

          # ── 网络搜索 ────────────────────────────────────────────────────────────────
          # 用于查询技术标准、标准件参数、材料数据等

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000

          # ── ⛔ 权限预设 / SW单行模式：绝对不要写在这个文件里！────────────────────────
          # 【2026-09-11 已踩两次，第二次 18:11 —— 别再犯】
          #
          # ✗ 错误写法（曾写在这里，导致整个 preset 挂载失败，三件事一起坏：
          #   新建会话 / 切工程模式 / 选模型）：
          #       - id: permission
          #         name: '@deepseek-ai/dsh-permission-presets'
          #         config: { presets: { ...含 sw-single-line... } }
          #
          # ✗ 「SW单行模式已集成到本预设中，无需额外安装插件」——这句话是错的。
          #   `@deepseek-ai/dsh-permission-presets` 是【宿主层(进程级)服务】，dsh-base bundle
          #   已在宿主组合里注册（node_modules/@deepseek-ai/dsh-base/cordis.patch.yml 的
          #   `- id: permission` 行）。本文件是【会话下的子作用域组合】，再声明一次
          #   = 重复注册同名服务 → loader 报：
          #     failed to apply loader entry permission (@deepseek-ai/dsh-permission-presets):
          #     service "permissionPresets" has been registered
          #   注意：这条错误会先被 insert 那类错误挡住，修完才露出来，看起来像"修不好"。
          #
          # ✓ 要让 SW单行模式真正可用，唯一正确落点是 patch 宿主层：
          #     文件：profiles/web/cordis.patch.yml
          #     内容：- id: permission
          #             name: '@deepseek-ai/dsh-permission-presets'
          #             config:
          #               presets: { ...必须完整重述全部预设，patch 是整体替换该行 config... }
          #   并且：预设表是进程级配置 → 【必须重启 DSH 才生效】（不像本 preset 那样热生效）。
          #
          # ✓ 客户端三栏布局 / 警告横幅需要那个 sw-single-line-mode 插件包，它必须走
          #   profile bundle 注册（plugins 目录 + package.json 的 dependencies 与
          #   dsh.profile.bundles），不能靠 pnpm add（本机 pnpm 死锁，见 dsh-troubleshoot）。
          #   目前 ~/.dsh/.agent-presets/engineering/plugins/ 目录并不存在。
          #
          # 校验：改完本文件先跑
          #   node C:\Users\j1877\.workbuddy\dsh_backup\check-dsh-presets.js engineering
          # 它会把这类"宿主层插件混入 preset"直接标红。
