                  第 4 个 subagent / subagent_fork 会直接返回 SUBAGENT_LIMIT_REACHED。
                  所以：
                  · 编制超过 3 个建模房间时，波1 必须**分批**（每批 ≤3），本批全部 room-end 后再开下一批；
