                  not_started=未开始 / queued=等待 SW / building=正在建 / validating=待验收 /
                  done=完成 / rebuilding=需要重建 / blocked=验收受阻 / stale=文件或凭据已变更 /
                  failed=失败 / disconnected=宿主失联。
                  右侧面板「零件」区读的就是这一份，【不要在对话里另报一套状态】。
                  看板 degraded=true 表示监控器不可达，此时显示「不可用」而不是「没有零件」。

                【SW使用权 · 外部监控器】SolidWorks 使用权由外部服务 DSH-SW-Monitor 统一分配：
                 · 每条 sw_bridge 命令执行前自动向监控器要一次性许可，拿不到就【不执行】；
                 · 忙时命令返回 **sw_busy + job_id**：用 job_output 等这个 job 自然结束，然后重试同一条命令。
                 **禁止 sleep 轮询、禁止反复重试、禁止 job_kill 它**（等待发生在后台任务里，不占回合）。
                 · MONITOR_NOT_CONFIGURED = 服务没接上：此时所有建模命令一律拒绝。旧进程内锁已删除，
                   没有回退路径；先启动服务再 python "<根>\tools\mode_gate.py" sw-monitor attach --drained。
                 · 只读查看：python "<根>\tools\mode_gate.py" sw-monitor status。
                 小屋内写单脚本用 run 跑多步，禁逐步调。建模完 close-all 会归还使用权（不必等 room-end）。

                🚫【长等待·铁律（BUG-A1① 修复 2026-11-07）】禁止用 time.sleep / Start-Sleep 轮询去等子代理、等房间、等 SW 锁。
                事故（session-6019cd4b）：job_output{wait:true,timeout_ms:270000} 静默阻塞，
                  用户以为 DSH 死机而强退；停机瞬间 ctx.jobs 失活 → 框架抛
                  cannot get required service "jobs" in inactive context → 整轮 turn/end{interrupted}。
                🔴 本次删除的旧句（原文照留，便于比对）：「③ 必须等后台 job 时：
                  【单次 sleep ≤30s，wait:true 的 timeout_ms ≤30000】，宁可多轮短等。」
                  现场：这句话被当成"标准姿势"照抄，实测单轮 477 次 sleep(30)、轮询 4 小时 02 分（占墙钟 66%），
                    期间零产物、零进度，用户以为进程卡死。
                  根因：它把"轮询"写成了等房间的第一选择 —— 只要模型还愿意等，就能无限 sleep 下去，
                    永远没有"已经等完了"的判据；轮询次数不产生任何状态，只烧时间。
                  判据：同一等待目标连续 sleep ≥4 次即视为违规（= 该用阻塞原语却没用）。
                ✅ 等房间 / 等子代理 / 等 SW 使用权：只准用【宿主后台 job 或一次性查询】，禁止 sleep 循环：
                   ① sw_busy 返回的 job_id → job_output 等它【自然结束】（不要 wait:true 长超时、不要反复取）
                      这是监控器的 wait-lock 后台任务：队首预留时它自己结束，模型拿到的是 job id 而不是阻塞。
                   ② python "<根>\tools\mode_gate.py" wait-rooms "<房间1>,<房间2>" --timeout 20
                      一次拿到 ready / attention / paused / waiting；返回 job_required=true 时说明还没到终态，
                      该做的是"让宿主挂 wait-rooms 后台 job"或稍后再查一次，**不是循环调用本命令**。
                   ③ python "<根>\tools\mode_gate.py" room-board --wait 900
                      "等到有变化再返回"：看板指纹变了 / 全部在世房间离开 active / 到点，三者任一即返回；
                      返回里带 waited_sec 与 returned_because（timeout 只说明"还在跑"，不是判死依据）。
                   ④ python "<根>\tools\mode_gate.py" room-board --json（+ room-report-read <房间>）
                      只读判据：state / safe_to_restart / next_action / report_stage；看不看都要看字段，别按耗时猜。
                 ⚠️ 只有在【确实没有阻塞原语可用】时（例：等一个 sw_bridge run 的后台 job 收尾），
                   才允许短 sleep，且【同一等待目标连续不得超过 3 次】；第 4 次必须停下改用上面的原语，
