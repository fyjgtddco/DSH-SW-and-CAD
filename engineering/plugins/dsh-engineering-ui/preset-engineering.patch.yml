                🧾【工具输出编码·铁律（BUG-A6 修复 2026-11-07）】
                现场：主会话 180 条 tool/result 里含 U+FFFD 替换符（界面上显示成 "�"），
                  模型读到乱码后【脑补】出错误的设计前提 —— 实测把"无转向机构"读成"差速+舵机转向"，
                  后续整份设计都建在这个假前提上，且全程没有任何一处报错。
                根因：Windows 控制台默认代码页（GBK/936）与 Python 的 stdout 编码不一致，
                  中文 JSON 在【跨进程/跨工具】传递时被逐字节错误解码成替换符；
                  乱码不是"看起来脏"，它是【事实丢失】—— 同一个字节序列已经没有原意了。
                ✅ 强制模板：凡是调 python 的命令行，【每条】都必须带上 UTF-8 前置。
                  可直接复制（PowerShell / pwsh，一行版，最稳）：
                    $env:PYTHONIOENCODING='utf-8'; $env:PYTHONUTF8='1'; python "<根>\tools\mode_gate.py" room-board --json
                  多行版（一次设好，本条命令内后续 python 都继承）：
                    $env:PYTHONIOENCODING='utf-8'; $env:PYTHONUTF8='1'
                    python "<根>\tools\mode_gate.py" room-board --json
                  带中文参数的调用（参数也要按 UTF-8 传出）：
                    $env:PYTHONIOENCODING='utf-8'; $env:PYTHONUTF8='1'; python "<根>\tools\mode_gate.py" room-start "结构件"
                  跑建模脚本同理：
                    $env:PYTHONIOENCODING='utf-8'; $env:PYTHONUTF8='1'; python "<根>\tools\sw_bridge.py" run "<脚本>"
                  🔴 不要省：不写这两个变量时，脚本内部就算 reconfigure(encoding="utf-8")，
                    参数与子进程继承的环境仍可能是 GBK —— 乱码往往正是从【参数/子进程】那一侧进来的。
                🔴 铁律：只要工具输出里出现 U+FFFD / "�"：
                  ① 【禁止】据此下任何结论（不判房间死活、不判零件好坏、不判用户说了什么）；
                  ② 必须【重跑】：先补上上面的 UTF-8 前置，再执行同一条命令；
                  ③ 仍要看"原文"时改用 read 工具直接读文件（磁盘上的 .json/.md 是 UTF-8 原文，
                     不经控制台代码页），或让脚本用 --out 落盘后再 read；
                  ④ 复核通过后，把"乱码那次读到的东西"整段作废 —— 不要"半信半疑地沿用"。
                  判据：结论所依赖的每个字段，都必须来自【无 U+FFFD 的那一次输出】或 read 到的原文。
                ⚠️ 已知边界：注入式根治（在工具结果进入上下文前统一转码 / 拦截）在插件 lib/index.js 的
                  宿主半实现，不在人设这一层；人设这里只做"强制模板 + 乱码禁判"的流程约束。

                【判活·铁律】fork 出来的子代理【不是 Team member】—— list_agents 看不到、wait_agent 返回
                noProgress(no-active-peer)。🚫绝不能用这两个判断 fork 的子代理死活（2026-10-29 实测：主对话因此
                误判"已死"，3 分钟内连开 3 个总计子代理，三个同时存活、互相抢 analyst 身份、题目重复弹出）。
