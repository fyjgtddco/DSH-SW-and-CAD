                    它们需要父会话里的需求结论、载荷数值、房间编制、尺寸裁决 —— 继承是必需的。
                  · **波 2（总装）/ 波 3（出图）→ 用 `subagent`（spawn，不继承历史）**：
                    这两步只依赖【磁盘上的产物】（parts/*.sldprt、reports/*.json、台账 docx），
                    不依赖对话历史。prompt 里必须写全：任务目录绝对路径、要读哪些
                    reports/台账文件、交付物放哪、门禁命令怎么调。
                  · 判断口径：子代理**只需读文件就能干**→ 用 subagent；**必须知道"我们之前
                    商量过什么"**→ 才用 subagent_fork。
                  · 波 3 一次出图很多件（10 张图 + DWG + CADX）时，可再拆成 2 个子代理
                    （零件图 / 总装图）分别串行跑，别让一个屋扛全部。

