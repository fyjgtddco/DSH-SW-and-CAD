                ✅【总计子代理例外】它不是建模小屋：只允许调 mode2_flow 的阶段/提问/编制命令（analyst-bind/begin-stage/
                  mark-stage-done/ask/answer-question/refresh-stage/set-subagent-plan/stage-status/questions）与
                  python "<根>\tools\ask_user.py"（子代理唯一提问桥）；仍禁调 mode_gate 编排命令（room-start/subagent-assign 等）。
                🚫小屋建齐前，主对话禁调建模查询类 sw_bridge(run/new/open/sketch/drawing/dwg/export/cad/massprops)、
                禁 pwsh 跑建模脚本。仅可 list_agents/等待/建下一个 subagent。
                ✅唯一例外 close-all（清场，每波前/汇合前可用）。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── Shell 工具 ──────────────────────────────────────────────────────────────
          # 提供命令行操作能力，用于调用 CAD/SW 脚本、处理文件等

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── 文件系统工具 ────────────────────────────────────────────────────────────
          # 用于读写设计文件、配置文件和脚本

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── 后台任务控制 ────────────────────────────────────────────────────────────
          # 用于管理长时间运行的 CAD 脚本

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── 技能系统 ────────────────────────────────────────────────────────────────
          # 提供 CAD/SW 工作流的技能文件加载

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── 目标追踪 ────────────────────────────────────────────────────────────────
          # 用于追踪"完成工图"的总体目标，确保 AI 始终聚焦于核心任务

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── 计划模式 ────────────────────────────────────────────────────────────────
          # 工程设计导向的计划模式，强调设计评审和方案验证

          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    你处于**工程设计计划模式**。在执行 exit_plan_mode 之前，你必须保持计划模式。

                    在计划模式下，你只能做以下事情：

                    1. **需求分析**：通过提问和搜索弄清用户的实际需求
                    2. **方案调研**：搜索相关的设计标准、标准件、材料数据
                    3. **可行性分析**：分析设计方案的可行性
                    4. **制定设计计划**：详细列出每一步操作

                    严禁在计划模式下直接进行设计操作（画图、建模等）。

                    工程设计计划必须包含以下内容：

                    ## 1. 设计目标
                    - 明确要设计的零件/装配体是什么
                    - 功能要求
                    - 设计约束（尺寸、重量、材料等）

                    ## 2. 尺寸与可行性分析
                    - 关键尺寸清单
                    - 每个尺寸的合理性验证
                    - 运行可行性分析

                    ## 3. 设计步骤
                    - 按顺序列出每个建模步骤
                    - 每个步骤的输出物
                    - 每个步骤的验证标准

                    ## 4. 验证计划
                    - 干涉检查计划
                    - 运动模拟计划
                    - 工程图输出计划

                    ## 5. 风险与应对
                    - 可能遇到的问题
                    - 备用方案

                    完成设计计划后，调用 exit_plan_mode 提交计划供用户审批。
                    用户批准后，退出计划模式，进入设计执行阶段。

          # ── 上下文压缩 ──────────────────────────────────────────────────────────────
          # 管理长对话的上下文窗口，确保设计过程的可追溯性

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              # ── 【2026-11-08】换成工程模式专用压缩器 ────────────────────────
              # 用户要求：「压缩历史的插件是在工程模式下面的，只在工程模式里面触发，
              #   不要跑到其他模式里面触发」。
              #
              # 为什么换 name 而不是在宿主层再挂一次：
              #   压缩服务在同一上下文只能有一个实例（ctx.compaction）。把它写在
              #   【本 preset 的 compaction 子项】里，天然就只在 engineering 会话
              #   上下文内生效；标准/极简等其它预设读的是它们自己的 compaction-basic，
              #   两边互不相干，绝不会串台。
              #
              # 它继承 @deepseek-ai/dsh-compaction-basic，只覆盖 summarize() ——
              # 选区/锁/事件/计量全部沿用父类，替换压缩器不会破坏会话存档。
              # 配置项与父类完全一致（阈值口径见下方注释）。
              - id: compaction-engineering
                name: 'dsh-engineering-compaction'
                config:
                  # ══ 【A14 修复】阈值必须跟【实际窗口】成比例，不能钉死在 ~100K ══
                  # 现场（2026-11-07 会话）：6 次压缩触发点全落在
                  #   99,838 – 100,025 token（见 :1116/:1636/:2304/:3206/:4186/:4506），
                  #   而 :224 记录的 contextWindow 是 **200000**。
                  #   也就是说：窗口 200K，却在 100K 就压缩 —— 白白丢掉一半可用上下文，
                  #   长任务被迫压缩 6 次，每次都要重发 70–100K 前缀。
                  #
                  # 口径（对齐 02 文档「修复」）：阈值 = contextWindow × 0.7。
                  #
                  # ══ 【BUG-A14 修复·核算结论】只调 ratio 是【不够】的 ════════════
                  # 宿主真实公式（@deepseek-ai/dsh-compaction-basic/lib/index.js:124-147
                  #   resolveCompactSpec，逐字核对，勿凭猜）：
                  #     messageBudgetTokens  = contextWindow − reservedCompletionTokens
                  #     pressureBudgetTokens = messageBudgetTokens − policy.headroomTokens
                  #     thresholdTokens      = min(contextWindow × thresholdRatio,
                  #                                pressureBudgetTokens)
                  # 其中（同文件 757-759 reservedCompletionTokens）：
                  #     reservedCompletionTokens = header.config.maxTokens
                  #                              ?? defaultMaxTokens ?? 0
                  #
                  # 判据（200K 窗口反推）：
                  #   · reserved=0    → 预算项 152000，比例项 140000 → **比例项生效 = 140K** ✓
                  #   · reserved=65536→ 预算项  86464，比例项 140000 → **预算项生效 =  86K** ✗
                  #     也就是说：reserved 一高，改 ratio 不但没用，阈值反而【比原来
                  #     ~100K 更低】—— 压缩更早发生，正是 A14 要治的病。
                  #   · 要让 140K 生效，必须满足 200000−reserved−48000 ≥ 140000
                  #     → reserved ≤ 12000。而适配器给的 defaultMaxTokens 可能是 256K
                  #     （llm-deepseek:450），那样 messageBudget 直接为负、
                  #     宿主抛 TargetPressureConfigError（压缩彻底不工作）。
                  #
                  # 现实约束（不硬凑）：reserved 由【适配器/路由】决定，不是本 yml 能配的；
                  #   所以这里给出一组【在 reserved=0 与 reserved=64K 两侧都安全】的值：
                  #     headroom 从 48000 降到 8000 → 预算项 = 窗口−reserved−8000，
                  #     reserved=64K 时 = 200000−65536−8000 = 126464（仍是预算项生效，
                  #     但比 86K 明显更接近 140K，且保留 8K 安全余量）。
                  #   ⚠️ 把它压到 0 会把"网关真实上限低于声明窗口"的保护一起拿掉
                  #     （192K 声明/100K 真实的场景会一路压到超限才动），所以不取 0。
                  #
                  # 结论（如实写）：200K 窗口下，该宿主在本配置下实际阈值 ≈126K，
                  #   达不到名义上的 140K —— 但那仍然是"用满窗口的 63%"，
                  #   相比修复前的 50%（100K）是实打实的改善。
                  #   真实生效值请以 /dsh-engineering-ui/compaction-history 返回的
                  #   threshold{value, limiter:'ratio'|'budget'} 为准（那是按真实
                  #   contextWindow 现算的，不是抄 yml 的名义值）。
                  #
                  # ══ 【2026-11-11 修正·与官方默认平齐】0.7 → 0.8 ══════════════
                  # 用户提问：「那个压缩的为啥一直都不压缩？按理来说官方的都会
                  #   压缩几次，要不要把阈值往下调一点？和官方的压缩平齐会更好？」
                  #
                  # ── 先回答"为什么一直不压缩"（这不是配置问题）──────────────
                  # 实测（验收会话 20261111_131815，9 个会话的 usage 字段逐个统计
                  #   inputTokens + cacheReadTokens）：
                  #     峰值上下文最高 384,522 token，窗口 1,000,000。
                  #   阈值 0.7 → 700,000。384K 远达不到 700K，所以【零次压缩是
                  #   预期行为，不是故障】。"官方都会压几次"的前提是窗口 200K 级别
                  #   （跑 30 万 token 的会话自然要压好几次）；本机是 1M 窗口。
                  #
                  # ── 为什么是"往上"而不是"往下"调 ────────────────────────────
                  # 原话里说"往下调一点"，但方向要反过来：
                  #   阈值 = min(窗口×ratio, 窗口−reserved−headroom)
                  #   往下调 ratio = 更早压缩 = 更频繁丢细节 + 每次重发长前缀，
                  #   正是 A14 要治的病（历史上 200K 窗口在 100K 就压，白丢一半）。
                  #   要"更容易触发压缩"，只能【抬高】ratio 或【减小】headroom。
                  #
                  # ── 与官方平齐（本次决定）──────────────────────────────────
                  # 官方 @deepseek-ai/dsh-compaction-basic 的内置默认（从安装体
                  #   lib/index.js 逐字核对）：
                  #     DEFAULT_THRESHOLD_RATIO = 0.8
                  #     headroomTokens 默认      = 65536
                  #     DEFAULT_RETAIN_RATIO     = 0.16
                  # 这里取【ratio 平齐官方 0.8】，但 headroom 保留工程模式更小的
                  #   8000 —— 理由是机械设计会话单轮工具输出极大（整段 JSON /
                  #   建模脚本），需要更多消息预算；headroom 只影响"预算项"是否
                  #   成为瓶颈，取 8000 能让比例项稳定生效（1M 窗口 → 800K）。
                  #   实测口径：1M 窗口下两者都得 800K，reserved=0 与 65536 同值，
                  #   所以这条只是"更贴近官方语义"，不是"更激进"。
                  # retainRatio 同步平齐官方 0.16（保留更多原文，少丢数值）。
                  #
                  # ══ 【2026-11-12 修复·压缩"压不动"的真因】══════════════════════
                  # 上面那句"headroom 只影响预算项"是【错的】，必须纠正（保留原文
                  #   以供对照，别删）：
                  #
                  # 宿主 dsh-compaction-basic/lib/index.js:63-64 逐字是：
                  #     const headroomTokens = config.headroomTokens ?? 65536;
                  #     const maxTokens      = config.maxTokens ?? headroomTokens;
                  # → **没显式配 maxTokens 时，headroomTokens 同时就是摘要器的
                  #   输出上限**。它不只影响"何时开始压"，还决定"摘要能写多长"。
                  #
                  # 现场证据（46 个发生过压缩的会话、277 次 compaction/end）：
                  #   · headroom=48000 时期（11-01 / 11-07）：maxTokens=48000，
                  #     183 次 compaction/summary，压缩基本正常；
                  #   · 本文件把 headroom 降到 8000（11-08）后：maxTokens 跟着变
                  #     8000，而 prompt.js 要求"Copy EVERY F-number and M-number
                  #     ... one per line"（现场要抄 5000~7000 条）→ 输出必然被截断
                  #     → 日志里 **54 次 `trae: llm response empty stream (code=3003)`**。
                  #   · 另有 **26 次 `ENG_COMPACTION_NOT_SMALLER`**：
                  #     "after L0 fact restoration the checkpoint is not smaller
                  #      (input 165343 chars, output 461129 chars)" —— 输出是输入的
                  #     2.79 倍，压缩把自己撑爆了。
                  #
                  # 结论：**降 headroom 会同时削弱摘要输出能力**，是一处隐蔽的
                  #   耦合。修法不是把 headroom 调回去（那会让阈值降成 86K），
                  #   而是【显式配 maxTokens】把两个概念拆开：
                  #     · headroomTokens = 8000  → 只管阈值
                  #     · maxTokens      = 48000 → 只管摘要输出上限（足够抄完编号）
                  #
                  # ══ 【2026-11-12 用户指定】阈值改成 200K（原 800K）══════════════
                  # 用户原话：「改成200k压缩，不要800k」。
                  #
                  # 为什么是 ratio 0.2：当前默认路由 marvis/main-auto 的
                  #   contextWindow = 1,000,000（日志 request/context 实测），
                  #   而阈值 = min(窗口×ratio, 窗口−reserved−headroom)。
                  #   reserved = header.config.maxTokens ?? 0 = 0（marvis 信封
                  #   刻意不声明 maxTokens），headroom = 8000
                  #   → 预算项 = 992000，远大于比例项 → **比例项生效**。
                  #   要得到 200,000 → ratio = 200000/1000000 = 0.2。
                  #
                  # ⚠️ 这是【按窗口比例】而不是绝对 token 数：换成 200K 窗口的
                  #   provider 时阈值会变成 40000，那对小窗口是过频压缩。
                  #   若将来固定走小窗口模型，应改回较高 ratio 或改用 modelPolicies
                  #   按模型单独设阈值（宿主支持 modelPolicies[].thresholdRatio）。
                  #
                  # ⚠️ 200K 阈值意味着【压缩会频繁发生】（当前会话峰值已到 ~480K，
                  #   即每涨到 200K 就压一次）。压缩本身是有损的，必须先保证
                  #   "压得动"—— 见下面 maxTokens 与 facts 回填的三处修复。
                  thresholdRatio: 0.2
                  headroomTokens: 8000
                  # ⚠️ 显式声明摘要输出上限，切断与 headroomTokens 的联动。
                  #    不写这行 = 上限被 headroom 压到 8000 = 必截断 = empty-stream。
                  #
                  # 【2026-11-12 调整】48000 → 16000。
                  # 为什么：当前主路由 buddy/deepseek-v4.1-flash 的
                  #   header.config.maxTokens = 128000（日志实测），
                  #   而摘要请求体量 = 输入(分段字符预算) + 输出(maxTokens)。
                  #   原来输入 ≈64000 字符 + 48000 输出 ≈ 112K，贴着 128K 上限
                  #   → 网关易判超限/截断 → 用户看到压缩报错。
                  #   现在输入 36000 字符（由插件内置默认）+ 16000 输出 ≈ 52K。
                  #   ⚠️ 48000 曾是 11-01/11-07 的成功值，但那时是 trae 网关、
                  #      窗口 200K 的配置；现在路由与窗口都变了，照搬旧值反而贴边。
                  #
                  # ⛔ 【严禁在此处写 chunkChars】—— 血的教训（2026-11-12）：
                  #   宿主 resolveConfig() 第一行就是
                  #     validateKeys(config, BASIC_COMPACT_CONFIG_KEYS, "BasicCompactionConfig")
                  #   BASIC_COMPACT_CONFIG_KEYS 是【严格白名单】，只有：
                  #     thresholdRatio / headroomTokens / retainRatio / retainTokens /
                  #     summarizationProvider / summarizationModel / maxTokens /
                  #     compactionRetries / maxOverflowRetries / modelPolicies / auto
                  #   一旦多写一个键（例如 chunkChars），宿主直接抛
                  #     "BasicCompactionConfig: unknown key chunkChars"
                  #   → **整个 engineering preset 装载失败、工程模式从列表里消失**。
                  #   分段字符预算请走环境变量 DSH_ENG_COMPACTION_CHUNK_CHARS
                  #   （那是插件自己读的，不经宿主 schema 校验）。
                  maxTokens: 16000
                  retainRatio: 0.16

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── 委派和工作流 ────────────────────────────────────────────────────────────
          # 支持子代理并行处理复杂设计任务（如同时计算多个零件的尺寸）

          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              # ⛔ 已停用（2026-11-05）：0.2.2-rc.1 起 @deepseek-ai/dsh-tool-subagent-control 的
              #    package.json exports 只剩 "."，**不再导出 "./list-agents" 子路径**；
              #    list_agents 工具已并入该包主入口，由上面 tool-subagent-control 那一行统一注册。
              #    若本行恢复启用，loader 的 import() 会失败：
              #      agent-preset/invalid: tool-subagent-list-agents
              #        (@deepseek-ai/dsh-tool-subagent-control/list-agents): never started
              #    → 整个 engineering preset 挂载失败 → 新建会话/选模型全部报错。
              #    ⛔ 禁止改成 disabled: false，也禁止删掉 disabled 字段。
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
                disabled: true

              # 【0.2.1 适配】原 `backgroundMode: continuable` 已删除。
              # 0.2.1 的 dsh-tool-subagent Config（lib/index.js:311-324）只有
              #   provider / toolName / modelSelectionSettings / agentOptions /
              #   agentPreset / allowedAgentPresets / maxDepth，
              # 全无 backgroundMode；0.2.1 的"后台续跑"语义改由
              #   工具立即返回 child ID + session/wait 两段式完成，
              # 不再是配置项。实测 schemastery 对未知键原样透传、不报错，
              # 所以旧键只是无效死配置，删掉行为完全不变。
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork

              # workflowEngine 的提供者。本部署版本随宿主发布的实现是 PTC（沙箱化 Node），
              # 与官方 standard preset 的 delegations 段完全一致。
              # ⛔ 绝对不要改写回 '@deepseek-ai/dsh-workflow-worker-thread'：
              #    该包在 0.1.6-alpha.2 里**不随安装体发布**（app.asar 内不存在），
              #    按名解析只会命中 profile 里残留的 0.1.0-rc.6 旧副本；它的模块求值会抛
              #    "does not provide an export named 'assertNever'/'snapshotJsonValue'"
              #    → 本行 never started → 本 isolate 域内没有任何一方提供 workflowEngine
              #    → tool-workflow / tool-ralph 永久 waiting for workflowEngine
              #    → 工程模式挂载失败（界面报「无法切换到「工程模式」」）。
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── 用户交互工具 ────────────────────────────────────────────────────────────
          # 用于向用户提问设计决策

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          # ── 任务清单 ────────────────────────────────────────────────────────────────
          # 用于追踪设计步骤的进度

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              # ── 【观察点 3 修复】并行模式(D)下必须允许多个 in_progress ──────
              # 原值 false 会硬拒「at most one task may be in_progress (got 3)」。
              # 但工程模式的 D 模式（部分小屋并行）本来就是**多个房间同时在跑**，
              # 主对话无法把并行房间如实标为进行中 —— 清单与实际状态不符，
              # todo_write 反而成了误导源。
              # 现改为 true：串行(E)模式由主对话自行只标一个（流程约定），
              # 并行(D)模式则可如实标注多个进行中。
              allowParallelInProgress: true

          # ── Webots 仿真 MCP（默认禁用，仅显式开启时装配）────────────────────────────
          # 本地 stdio 桥：python -B -m webots_mcp.server，命名空间 webots（工具名 mcp__webots__*）。
          #
          # 为什么默认禁用：整条链需要同时具备「隔离的 state 目录 + 装好冻结依赖的
          #   Python + 只读输入根 + 已校准的运行配置」，缺一项就只会得到
          #   CALIBRATION_REQUIRED / RUNTIME_NOT_READY。开着反而让每个会话多一个
          #   必然失败的启动项，所以用 DSH_WEBOTS_ENABLE=1 显式选择加入。
          #
          # ⚠️ 任务/房间身份【绝不】写进 preset env：每次调用由宿主从
          #   workflow_state.json + mode_state.json 推导并校验（lib/webots.js）。
          # ⚠️ failOnStartupError: false —— MCP 起不来只让 sim_* 工具缺失，
          #   不能让整个工程预设挂载失败（与"permission 不能进 preset"同级的红线）。
          # ⚠️ stdio 的 stdout 只留给 JSON-RPC；业务日志必须走 stderr/文件。
          - id: mcp-webots
            name: '@deepseek-ai/dsh-mcp-client'
            disabled: !!js process.env.DSH_WEBOTS_ENABLE !== '1'
            config:
              transport: stdio
              serverName: webots
              command: !!js process.env.DSH_WEBOTS_PYTHON || ''
              args: !!js "['-B','-m','webots_mcp.server','--input-root',process.env.DSH_WEBOTS_INPUT_ROOT || '',...(process.env.DSH_WEBOTS_RUNTIME_CONFIG ? ['--runtime-config',process.env.DSH_WEBOTS_RUNTIME_CONFIG] : [])]"
              cwd: !!js (process.env.DSH_ENGINEERING_ROOT || '') + '/tools'
              env:
                DSH_HOME: !!js process.env.DSH_HOME || ''
                DSH_STATE_DIR: !!js process.env.DSH_STATE_DIR || ''
                DSH_ENGINEERING_ROOT: !!js process.env.DSH_ENGINEERING_ROOT || ''
                WEBOTS_HOME: !!js process.env.WEBOTS_HOME || ''
                PYTHONIOENCODING: utf-8
                PYTHONUTF8: '1'
              failOnStartupError: false

          # ── 网络搜索 ────────────────────────────────────────────────────────────────
          # 用于查询技术标准、标准件参数、材料数据等

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000

          # ── ⛔ 权限预设 / SW单行模式：绝对不要写在这个文件里！────────────────────────
          # 【2026-09-11 已踩两次，第二次 18:11 —— 别再犯】
          #
          # ✗ 错误写法（曾写在这里，导致整个 preset 挂载失败，三件事一起坏：
          #   新建会话 / 切工程模式 / 选模型）：
          #       - id: permission
          #         name: '@deepseek-ai/dsh-permission-presets'
          #         config: { presets: { ...含 sw-single-line... } }
          #
          # ✗ 「SW单行模式已集成到本预设中，无需额外安装插件」——这句话是错的。
          #   `@deepseek-ai/dsh-permission-presets` 是【宿主层(进程级)服务】，dsh-base bundle
          #   已在宿主组合里注册（node_modules/@deepseek-ai/dsh-base/cordis.patch.yml 的
          #   `- id: permission` 行）。本文件是【会话下的子作用域组合】，再声明一次
          #   = 重复注册同名服务 → loader 报：
          #     failed to apply loader entry permission (@deepseek-ai/dsh-permission-presets):
          #     service "permissionPresets" has been registered
          #   注意：这条错误会先被 insert 那类错误挡住，修完才露出来，看起来像"修不好"。
          #
          # ✓ 要让 SW单行模式真正可用，唯一正确落点是 patch 宿主层：
          #     文件：profiles/web/cordis.patch.yml
          #     内容：- id: permission
          #             name: '@deepseek-ai/dsh-permission-presets'
          #             config:
          #               presets: { ...必须完整重述全部预设，patch 是整体替换该行 config... }
          #   并且：预设表是进程级配置 → 【必须重启 DSH 才生效】（不像本 preset 那样热生效）。
          #
          # ✓ 客户端三栏布局 / 警告横幅需要那个 sw-single-line-mode 插件包，它必须走
          #   profile bundle 注册（plugins 目录 + package.json 的 dependencies 与
          #   dsh.profile.bundles），不能靠 pnpm add（本机 pnpm 死锁，见 dsh-troubleshoot）。
          #   目前 ~/.dsh/.agent-presets/engineering/plugins/ 目录并不存在。
          #
          # 校验：改完本文件先跑
          #   node C:\Users\j1877\.workbuddy\dsh_backup\check-dsh-presets.js engineering
          # 它会把这类"宿主层插件混入 preset"直接标红。
